#cloud-config
# First-boot provisioning for the Droplet fallback path.
#
# Deliberately does NOT pull from a container registry. The point of this path is
# to have zero dependency on the registry, the image build, or a git remote — so
# it stays available when the App Platform route is the thing that's broken.
# Source is rsync'd up and built on the box instead. See deploy-droplet.sh.
#
# Pair with the `docker-20-04` marketplace image, which ships Docker and the
# compose plugin already; the package steps below are a safety net for a plain
# Ubuntu image.

package_update: true
package_upgrade: false

packages:
  - docker.io
  - docker-compose-plugin

write_files:
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
    # Without log rotation a chatty container will fill the disk and take the
    # whole box down. One line, and it prevents a genuinely bad afternoon.

runcmd:
  - [ systemctl, enable, --now, docker ]
  - [ mkdir, -p, /srv/app ]
  # Keep SSH open BEFORE enabling the firewall, or you lock yourself out of the
  # only machine you have.
  - [ ufw, allow, "22/tcp" ]
  - [ ufw, allow, "80/tcp" ]
  - [ ufw, allow, "443/tcp" ]
  - [ ufw, allow, "8000/tcp" ]
  - [ ufw, allow, "5173/tcp" ]
  - [ ufw, --force, enable ]
  # Marker file the deploy script polls, so it knows provisioning finished
  # rather than guessing with a sleep.
  - [ sh, -c, "touch /var/lib/cloud-init-done" ]
