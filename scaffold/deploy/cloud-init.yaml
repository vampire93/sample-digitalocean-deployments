#cloud-config
# Fallback deploy path: a single Droplet that builds and runs the stack on first boot.
#
#   doctl compute droplet create demo --region blr1 --size s-2vcpu-4gb \
#     --image docker-20-04 --ssh-keys <fingerprint> \
#     --user-data-file deploy/cloud-init.yaml --wait
#
# Up in ~4 minutes with no registry and no git remote. Trade-off: bare HTTP on the
# Droplet's IP (no TLS), and you own patching and restarts.

package_update: true

write_files:
  - path: /opt/app/docker-compose.yml
    content: |
      services:
        db:
          image: postgres:16-alpine
          environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: jobs
          volumes: ["pgdata:/var/lib/postgresql/data"]
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d jobs"]
            interval: 3s
            retries: 10
        api:
          image: registry.digitalocean.com/REPLACE_ME/jobs-api:v1
          environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/jobs
            ENV: production
            WORKER_ENABLED: "true"
          depends_on:
            db: {condition: service_healthy}
          restart: always
        web:
          image: registry.digitalocean.com/REPLACE_ME/jobs-web:v1
          ports: ["80:80"]
          depends_on: [api]
          restart: always
      volumes:
        pgdata:

runcmd:
  # The docker-20-04 marketplace image already has Docker and Compose.
  - [ sh, -c, "cd /opt/app && docker compose up -d" ]
  # Keep SSH reachable — locking yourself out of the only box is a bad afternoon.
  - [ ufw, allow, "22/tcp" ]
  - [ ufw, allow, "80/tcp" ]
  - [ ufw, --force, enable ]
