server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA history fallback: deep links must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy, so the browser never makes a cross-origin request and
    # there is no CORS configuration to get wrong.
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # --- Required for SSE ---
        # Without these, nginx buffers the event stream and holds events back until
        # the buffer fills. The dashboard then updates in bursts and looks broken.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        chunked_transfer_encoding off;
        # A long-lived stream must not be reaped by the default 60s read timeout.
        proxy_read_timeout 24h;
    }
}
